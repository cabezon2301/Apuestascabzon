<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Control de apuestas</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ff4500">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#0f1117;--card:#1a202c;--line:#2a3345;--tx:#e8ecf4;--mut:#8b95a8;--ok:#3ddc84;--bad:#ff6b6b;--acc:#ff4500;--inp:#0f1117;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f3f5f9;--card:#fff;--line:#d9dfea;--tx:#161b26;--mut:#5d6778;--ok:#0f9d58;--bad:#d93025;--inp:#f3f5f9}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Roboto,system-ui,-apple-system,"Segoe UI",sans-serif}
body{padding:0 14px 90px;max-width:560px;margin:0 auto}
header{display:flex;align-items:center;gap:10px;margin:10px 0 14px}
header img{width:40px;height:40px;border-radius:10px}
h1{font-size:21px;margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.row{display:flex;gap:10px}
.tog{flex:1;padding:15px 6px;border-radius:14px;border:2px solid var(--line);background:transparent;color:var(--tx);font-size:18px;cursor:pointer}
.tog.on.g{border-color:var(--ok);background:rgba(61,220,132,.14);color:var(--ok)}
.tog.on.a{border-color:var(--bad);background:rgba(255,107,107,.14);color:var(--bad)}
input{width:100%;margin-top:12px;padding:15px;border-radius:14px;border:1px solid var(--line);background:var(--inp);color:var(--tx);font-size:18px}
.save{width:100%;margin-top:14px;padding:15px;border:0;border-radius:14px;background:var(--acc);color:#fff;font-size:19px;font-weight:700;cursor:pointer}
.hint{color:var(--mut);font-size:14px;margin:10px 0 0;line-height:1.4}
.lbl{color:var(--mut);font-size:15px}
.big{font-size:42px;font-weight:700;margin-top:2px}
.mid{font-size:26px;font-weight:700;margin-top:2px}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sub{font-size:14px;color:var(--mut);margin-top:4px}
.mv{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.mv:last-child{border:0}
.mv small{color:var(--mut);display:block;margin-top:2px}
.x{background:none;border:0;color:var(--mut);font-size:20px;padding:6px 10px;cursor:pointer}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;padding:15px 4px;background:none;border:0;color:var(--mut);font-size:16px;cursor:pointer}
nav button.on{color:var(--acc);font-weight:700}
.sec{display:none}.sec.on{display:block}
.tools{display:flex;gap:10px}
.tools button{flex:1;padding:12px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--tx);font-size:15px;cursor:pointer}
</style>
</head>
<body>
<header><img src="icon-192.png" alt=""><h1>Control de apuestas</h1></header>

<div class="card">
  <div class="lbl">Balance total (ganado − apostado)</div>
  <div class="big" id="tot">S/ 0.00</div>
  <div class="sub" id="veredicto"></div>
</div>

<section class="sec on" id="s-reg">
  <div class="card">
    <div class="row">
      <button class="tog a on" id="bA" type="button">－ Apuesta</button>
      <button class="tog g" id="bG" type="button">＋ Ganancia</button>
    </div>
    <input id="monto" type="number" inputmode="decimal" step="0.01" min="0" placeholder="Monto (S/)">
    <input id="fecha" type="date">
    <input id="nota" type="text" placeholder="Nota (ej. Knicks vs Pacers) — opcional">
    <button class="save" id="guardar" type="button">Guardar</button>
    <p class="hint"><b>Apuesta</b> = lo que apuestas o depositas. <b>Ganancia</b> = lo que ganas o retiras.</p>
  </div>
  <div class="card"><div class="lbl">Hoy</div><div class="mid" id="hoy">S/ 0.00</div></div>
</section>

<section class="sec" id="s-res">
  <div class="grid">
    <div class="card"><div class="lbl">Hoy</div><div class="mid" id="rHoy"></div><div class="sub" id="dHoy"></div></div>
    <div class="card"><div class="lbl">Esta semana</div><div class="mid" id="rSem"></div><div class="sub" id="dSem"></div></div>
    <div class="card"><div class="lbl">Este mes</div><div class="mid" id="rMes"></div><div class="sub" id="dMes"></div></div>
    <div class="card"><div class="lbl">Total</div><div class="mid" id="rTot"></div><div class="sub" id="dTot"></div></div>
  </div>
  <div class="card"><div class="lbl" style="margin-bottom:6px">Resultado por día (últimos 14)</div><div id="dias"></div></div>
</section>

<section class="sec" id="s-mov">
  <div class="card"><div id="lista"></div></div>
  <div class="tools"><button id="exp" type="button">Copiar respaldo</button><button id="imp" type="button">Restaurar respaldo</button></div>
</section>

<nav>
  <button class="on" data-s="s-reg">✍️ Registrar</button>
  <button data-s="s-res">📊 Resumen</button>
  <button data-s="s-mov">🧾 Movimientos</button>
</nav>

<script>
(function(){
var KEY="apuestas_v2",tipo="a",data=[];
var $=function(i){return document.getElementById(i)};
function pad(n){return String(n).padStart(2,"0")}
function toStr(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function hoyStr(){return toStr(new Date())}
function shift(s,n){var p=s.split("-"),d=new Date(+p[0],+p[1]-1,+p[2]+n);return toStr(d)}
function lunes(){var d=new Date(),w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return toStr(d)}
function fmt(n){var s=Math.abs(n).toLocaleString("es-PE",{minimumFractionDigits:2,maximumFractionDigits:2});return (n<0?"−":"")+"S/ "+s}
function load(){try{data=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){data=[]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function calc(f){var a=0,g=0;data.forEach(function(m){if(f(m)){if(m.t==="g")g+=m.v;else a+=m.v}});return{a:a,g:g,n:g-a}}
function paint(el,n,plus){el.textContent=(plus&&n>0?"+":"")+fmt(n);el.classList.remove("pos","neg");if(n>0)el.classList.add("pos");else if(n<0)el.classList.add("neg")}
function box(id,r,did){paint($(id),r.n,true);$(did).textContent="Apostado "+fmt(r.a)+" · Ganado "+fmt(r.g)}
function render(){
  var h=hoyStr(),w=lunes(),ym=h.slice(0,7);
  var T=calc(function(){return true});
  paint($("tot"),T.n,true);
  $("veredicto").textContent=T.n>0?"Vas ganando 🟢":T.n<0?"Vas perdiendo 🔴":"Estás en cero";
  paint($("hoy"),calc(function(m){return m.d===h}).n,true);
  box("rHoy",calc(function(m){return m.d===h}),"dHoy");
  box("rSem",calc(function(m){return m.d>=w&&m.d<=shift(w,6)}),"dSem");
  box("rMes",calc(function(m){return m.d.slice(0,7)===ym}),"dMes");
  box("rTot",T,"dTot");
  var rows="";
  for(var i=0;i<14;i++){var d=shift(h,-i),r=calc(function(m){return m.d===d});
    var p=d.split("-");
    rows+='<div class="mv"><span>'+p[2]+"/"+p[1]+'<small>Apostado '+fmt(r.a)+" · Ganado "+fmt(r.g)+'</small></span><b class="'+(r.n>0?"pos":r.n<0?"neg":"")+'">'+(r.n>0?"+":"")+fmt(r.n)+"</b></div>"}
  $("dias").innerHTML=rows;
  var l=data.slice().sort(function(a,b){return a.d<b.d?1:a.d>b.d?-1:b.id-a.id});
  $("lista").innerHTML=l.length?l.map(function(m){var p=m.d.split("-");
    return '<div class="mv"><div><b class="'+(m.t==="g"?"pos":"neg")+'">'+(m.t==="g"?"+ ":"− ")+fmt(m.v)+"</b><small>"+p[2]+"/"+p[1]+"/"+p[0]+(m.n?" · "+esc(m.n):"")+'</small></div><button class="x" data-del="'+m.id+'" aria-label="Eliminar">✕</button></div>'}).join(""):'<div class="lbl">Aún no hay movimientos.</div>';
}
function setTipo(t){tipo=t;$("bA").className="tog a"+(t==="a"?" on":"");$("bG").className="tog g"+(t==="g"?" on":"")}
$("bA").onclick=function(){setTipo("a")};$("bG").onclick=function(){setTipo("g")};
$("guardar").onclick=function(){
  var v=parseFloat($("monto").value);if(!(v>0)){$("monto").focus();return}
  data.push({id:Date.now(),t:tipo,v:Math.round(v*100)/100,d:$("fecha").value||hoyStr(),n:$("nota").value.trim()});
  save();$("monto").value="";$("nota").value="";render()};
$("lista").onclick=function(e){var id=e.target.getAttribute("data-del");if(!id)return;
  if(confirm("¿Eliminar este movimiento?")){data=data.filter(function(m){return String(m.id)!==id});save();render()}};
Array.prototype.forEach.call(document.querySelectorAll("nav button"),function(b){b.onclick=function(){
  Array.prototype.forEach.call(document.querySelectorAll("nav button"),function(x){x.classList.toggle("on",x===b)});
  Array.prototype.forEach.call(document.querySelectorAll(".sec"),function(s){s.classList.toggle("on",s.id===b.getAttribute("data-s"))});
  window.scrollTo(0,0)}});
$("exp").onclick=function(){var t=JSON.stringify(data);
  if(navigator.clipboard){navigator.clipboard.writeText(t).then(function(){alert("Respaldo copiado. Pégalo en una nota.")},function(){prompt("Copia este respaldo:",t)})}else{prompt("Copia este respaldo:",t)}};
$("imp").onclick=function(){var t=prompt("Pega aquí tu respaldo:");if(!t)return;
  try{var a=JSON.parse(t);if(!Array.isArray(a))throw 0;data=a;save();render()}catch(e){alert("El respaldo no es válido.")}};
$("fecha").value=hoyStr();
load();render();
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
})();
</script>
</body>
</html>
